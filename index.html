<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>桌遊大廳</title>
<style>
  :root { --gold: #e8b64a; --gold-soft: #f6dfa0; --fg: #f3e8d0; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: #0c0807; }
  body { color: var(--fg); font-family: system-ui, -apple-system, "Microsoft JhengHei", "Noto Sans TC", sans-serif; }

  /* ===== 舞台：背景圖鋪滿畫面，所有可點的東西都用「圖上的座標」定位 =====
     --W / --H 是圖片的原始尺寸，--S 是圖片目前被放大的倍率。
     電腦版用橫圖（cover 鋪滿）；手機等直式畫面換成直圖（寬度剛好貼齊，上方留一塊暗色放標題）。 */
  .stage { position: fixed; inset: 0; container-type: size; overflow: hidden; background: #120805;
    --W: 1672; --H: 941; --S: max(100cqw / var(--W), 100cqh / var(--H));
    --T: calc(50cqh - var(--H) * var(--S) / 2); }
  .bg { position: absolute; inset: 0; background: #120805 url(img/lobby-desktop.webp) center / cover no-repeat; }
  .shade { position: absolute; inset: 0; pointer-events: none;           /* 四周壓暗，讓文字更清楚 */
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,.45) 100%); }

  .pin {
    --x: var(--dx); --y: var(--dy); --w: var(--dw); --h: var(--dh);
    position: absolute; z-index: 1;
    left: calc(50cqw + (var(--x) - var(--W) / 2) * var(--S));
    top:  calc(var(--T) + var(--y) * var(--S));
    width: calc(var(--w) * var(--S)); height: calc(var(--h) * var(--S));
    transform: translate(-50%, -50%);
  }

  @media (max-aspect-ratio: 1/1) {
    .stage { --W: 941; --H: 1672; --S: calc(100cqw / 941);
      /* 圖片上緣的位置：盡量讓兩扇門落在畫面偏下，但圖片最底一定要貼齊畫面底部 */
      --T: max(100cqh - var(--H) * var(--S), 58cqh - 835 * var(--S)); }
    .bg { background-image: url(img/lobby-mobile.webp); background-size: 100% auto; background-position: center var(--T); }
    .shade { background:
      linear-gradient(180deg, rgba(14,7,4,1) 0, rgba(14,7,4,1) var(--T), rgba(14,7,4,0) calc(var(--T) + 260 * var(--S))),
      linear-gradient(180deg, rgba(10,5,3,.75) 0, rgba(10,5,3,0) 150px),
      radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,.4) 100%); }
    .pin { --x: var(--mx); --y: var(--my); --w: var(--mw); --h: var(--mh); }
    .hero { left: 50%; top: max(calc(14px + env(safe-area-inset-top)), calc(var(--T) / 2 - 34px)); height: auto; width: min(94cqw, 520px); transform: translateX(-50%); }
    .portal[data-side="left"] .label  { left: 0; right: auto; transform: none; }
    .portal[data-side="right"] .label { left: auto; right: 0; transform: none; }
  }

  /* ===== 標題 ===== */
  .hero { text-align: center; width: min(calc(var(--w) * var(--S)), 94cqw); z-index: 2; display: flex; flex-direction: column; justify-content: center; }
  .hero::before { content: ""; position: absolute; inset: -10% -8%; z-index: -1; border-radius: 50%;
    background: radial-gradient(ellipse at center, rgba(14,7,4,.78) 0%, rgba(14,7,4,.55) 55%, rgba(14,7,4,0) 100%); }
  .hero h1 {
    margin: 0; line-height: 1.2; letter-spacing: .3em; padding-left: .3em;
    font-size: clamp(1.7rem, calc(58 * var(--S)), 3.4rem);
    font-family: "Noto Serif TC", "Source Han Serif TC", "Songti TC", "PMingLiU", Georgia, serif;
    background: linear-gradient(180deg, #fff1c9, #e8b64a 55%, #b9791b);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,.9));
  }
  .hero p { margin: 6px 0 0; font-size: clamp(.85rem, calc(24 * var(--S)), 1.15rem); color: var(--gold-soft); text-shadow: 0 1px 4px #000, 0 0 12px #000; }

  /* ===== 遊戲入口（圖上的門） ===== */
  .portal {
    display: block; color: inherit; text-decoration: none; cursor: pointer; outline: none;
    border-radius: 50% 50% 6% 6% / 36% 36% 3% 3%;
    transition: box-shadow .25s, background .25s, transform .25s;
  }
  .portal::before {                   /* 平常就有一圈淡淡的呼吸光，提示「可以點」 */
    content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    box-shadow: inset 0 0 calc(30 * var(--S)) rgba(255, 220, 140, .0);
    animation: breathe 3.2s ease-in-out infinite;
  }
  @keyframes breathe { 50% { box-shadow: inset 0 0 calc(34 * var(--S)) rgba(255, 220, 140, .35); } }
  .portal:hover, .portal:focus-visible {
    background: rgba(255, 230, 160, .14); transform: translate(-50%, -50%) scale(1.025);
    box-shadow: 0 0 calc(46 * var(--S)) calc(8 * var(--S)) rgba(255, 205, 110, .55), inset 0 0 calc(40 * var(--S)) rgba(255, 220, 140, .4);
  }
  .portal:focus-visible { outline: 2px solid var(--gold-soft); outline-offset: 4px; }
  .portal.soon { cursor: default; }
  .portal.soon::before { animation: none; }

  .label {
    position: absolute; left: 50%; top: 100%; transform: translateX(-50%);
    margin-top: calc(12 * var(--S)); padding: .35em 1em; white-space: nowrap; text-align: center; line-height: 1.25;
    border-radius: 999px; border: 1px solid rgba(232, 182, 74, .65);
    background: linear-gradient(180deg, rgba(40, 28, 18, .9), rgba(16, 11, 8, .92));
    box-shadow: 0 4px 16px rgba(0,0,0,.6), inset 0 0 12px rgba(232,182,74,.12);
  }
  .label b { display: block; font-size: clamp(1rem, calc(32 * var(--S)), 1.5rem); letter-spacing: .12em; color: var(--gold-soft); }
  .label small { display: block; font-size: clamp(.72rem, calc(20 * var(--S)), .95rem); color: #d8c9a8; }
  .portal.soon .label small { color: #ffc27a; }
  .portal:hover .label, .portal:focus-visible .label { border-color: var(--gold-soft); }

  /* 提示訊息 */
  #toast {
    position: fixed; left: 50%; bottom: max(24px, env(safe-area-inset-bottom)); z-index: 10;
    transform: translate(-50%, 20px); opacity: 0; pointer-events: none; transition: .25s;
    padding: 10px 18px; border-radius: 10px; border: 1px solid #7a5513; max-width: 90vw; text-align: center;
    background: rgba(20, 14, 10, .95); color: var(--gold-soft); box-shadow: 0 8px 24px rgba(0,0,0,.6);
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  @media (prefers-reduced-motion: reduce) { .portal::before { animation: none; } }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="bg"></div>
  <div class="shade"></div>
  <div class="pin hero" style="--dx:836; --dy:845; --dw:760; --dh:130;  --mx:470; --my:1470; --mw:860; --mh:190;">
    <h1>桌遊大廳</h1>
    <p>選擇一扇門，約朋友一起進入冒險</p>
  </div>
</div>
<div id="toast" role="status"></div>

<script>
// ===== 遊戲清單：以後新增遊戲、換圖，只要改這一區 =====
// open: true  → 可以進入；false → 顯示「即將開放」
// d = 電腦版圖片上「門」的位置，m = 手機版圖片上的位置。
//     x, y = 門的中心點；w, h = 門的寬高。單位是「原圖的像素」（電腦版圖 1672×941、手機版圖 941×1672）。
const GAMES = [
  { name: "印加寶藏", sub: "2～8 人 · 見好就收", href: "incan-gold/", open: true,
    d: { x: 365,  y: 497, w: 285, h: 405 },  m: { x: 180, y: 915, w: 245, h: 395 } },
  { name: "農家樂",   sub: "即將開放", href: "agricola/", open: false,
    d: { x: 1343, y: 503, w: 295, h: 400 },  m: { x: 777, y: 920, w: 240, h: 395 } },
];

const stage = document.getElementById("stage");
const toast = document.getElementById("toast");
let toastTimer = null;
function say(text) {
  toast.textContent = text; toast.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => toast.classList.remove("show"), 2200);
}

for (const g of GAMES) {
  const a = document.createElement("a");
  a.className = "pin portal" + (g.open ? "" : " soon");
  a.href = g.open ? g.href : "#";
  a.dataset.side = g.m.x < 941 * 0.4 ? "left" : g.m.x > 941 * 0.6 ? "right" : "center";   // 手機版標籤往畫面內側靠，避免被切掉
  a.setAttribute("aria-label", g.name + (g.open ? "" : "（即將開放）"));
  for (const [k, p] of [["d", g.d], ["m", g.m]]) {
    a.style.setProperty("--" + k + "x", p.x); a.style.setProperty("--" + k + "y", p.y);
    a.style.setProperty("--" + k + "w", p.w); a.style.setProperty("--" + k + "h", p.h);
  }
  const label = document.createElement("div");
  label.className = "label";
  const b = document.createElement("b"); b.textContent = g.name;
  const s = document.createElement("small"); s.textContent = g.sub;
  label.append(b, s); a.appendChild(label);
  if (!g.open) a.addEventListener("click", (e) => { e.preventDefault(); say("「" + g.name + "」還在建造中，敬請期待！"); });
  stage.appendChild(a);
}
</script>
</body>
</html>
